<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Little Question ❤️</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        overflow: hidden;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ffd6e7, #fff0f5);
    }

    .card {
        width: min(92vw, 520px);
        padding: 45px 28px;
        text-align: center;
        background: rgba(255,255,255,.94);
        border-radius: 28px;
        box-shadow: 0 15px 45px rgba(180, 70, 110, .2);
        position: relative;
        z-index: 2;
    }

    .heart {
        font-size: 70px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        50% { transform: scale(1.15); }
    }

    h1 {
        color: #d6336c;
        margin: 10px 0;
        font-size: clamp(28px, 7vw, 42px);
    }

    p {
        color: #555;
        font-size: 18px;
        line-height: 1.6;
    }

    .buttons {
        position: relative;
        height: 100px;
        margin-top: 25px;
    }

    button {
        border: 0;
        border-radius: 999px;
        padding: 15px 30px;
        font-size: 17px;
        font-weight: bold;
        cursor: pointer;
        transition: transform .2s;
    }

    #yes {
        background: #e64980;
        color: white;
        box-shadow: 0 8px 18px rgba(230,73,128,.3);
    }

    #yes:hover { transform: scale(1.08); }

    #no {
        position: absolute;
        background: #eee;
        color: #555;
        left: 55%;
        top: 0;
    }

    .hidden { display: none; }

    #success h2 {
        color: #d6336c;
        font-size: 32px;
    }

    .confetti {
        position: fixed;
        top: -20px;
        font-size: 22px;
        animation: fall 3s linear forwards;
        z-index: 5;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(720deg);
            opacity: 0;
        }
    }
</style>
</head>

<body>
<div class="card" id="question">
    <div class="heart">❤️</div>
    <h1>Will you go on a date with me?</h1>
    <p>
        I have a little question for my favorite person...<br>
        Would you make a beautiful memory with me? 🥰
    </p>

    <div class="buttons">
        <button id="yes">YES ❤️</button>
        <button id="no">NO 😭</button>
    </div>
</div>

<div class="card hidden" id="success">
    <div class="heart">💖</div>
    <h2>YAY!!! You said YES! 🥰</h2>
    <p>
        It's a date! ❤️<br>
        I can't wait to spend some time with you.
        <br><br>
        <strong>See you soon, love! 🌹</strong>
    </p>
</div>

<script>
const noButton = document.getElementById("no");
const yesButton = document.getElementById("yes");
const question = document.getElementById("question");
const success = document.getElementById("success");

function moveNo() {
    const area = document.querySelector(".buttons");
    const maxX = area.clientWidth - noButton.offsetWidth;
    const maxY = area.clientHeight - noButton.offsetHeight;

    noButton.style.left = Math.max(0, Math.random() * maxX) + "px";
    noButton.style.top = Math.max(0, Math.random() * maxY) + "px";
}

noButton.addEventListener("mouseenter", moveNo);
noButton.addEventListener("touchstart", (e) => {
    e.preventDefault();
    moveNo();
});

yesButton.addEventListener("click", () => {
    question.classList.add("hidden");
    success.classList.remove("hidden");

    for (let i = 0; i < 40; i++) {
        const item = document.createElement("div");
        item.className = "confetti";
        item.textContent = ["❤️", "💖", "💕", "✨", "🌹"][Math.floor(Math.random() * 5)];
        item.style.left = Math.random() * 100 + "vw";
        item.style.animationDelay = Math.random() * 1.5 + "s";
        document.body.appendChild(item);
        setTimeout(() => item.remove(), 4500);
    }
});
</script>
</body>
</html>
